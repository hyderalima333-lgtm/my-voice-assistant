<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Assistant</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    #mic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      font-size: 45px;
      background: #333;
      color: white;
    }

    #status {
      margin: 25px 0;
      font-size: 18px;
    }

    #text {
      font-size: 20px;
      margin: 20px;
      min-height: 30px;
    }

    #answer {
      font-size: 20px;
      line-height: 1.5;
      margin: 25px auto;
      max-width: 600px;
    }
  </style>
</head>

<body>

  <h1>My Voice Assistant</h1>

  <button id="mic">🎤</button>

  <div id="status">Tap the microphone</div>

  <div id="text"></div>

  <div id="answer"></div>

<script>
const WORKER_URL =
  "https://dry-frost-52c6.hyderalima333.workers.dev";

const mic = document.getElementById("mic");
const status = document.getElementById("status");
const text = document.getElementById("text");
const answer = document.getElementById("answer");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  status.textContent =
    "Speech recognition is not supported. Please use Chrome.";
}

const recognition = SpeechRecognition
  ? new SpeechRecognition()
  : null;

if (recognition) {
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  mic.onclick = () => {
    text.textContent = "";
    answer.textContent = "";
    status.textContent = "Listening...";

    recognition.start();
  };

  recognition.onresult = async (event) => {
    const message =
      event.results[0][0].transcript;

    text.textContent = "You: " + message;
    status.textContent = "Thinking...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "AI request failed"
        );
      }

      answer.textContent = data.answer;
      status.textContent = "Tap the microphone";

      const speech =
        new SpeechSynthesisUtterance(data.answer);

      speech.lang = "en-IN";
      speech.rate = 1;

      speechSynthesis.cancel();
      speechSynthesis.speak(speech);

    } catch (error) {
      answer.textContent =
        "Sorry, something went wrong.";

      status.textContent =
        "Please try again.";
    }
  };

  recognition.onerror = (event) => {
    status.textContent =
      "Microphone error: " + event.error;
  };
}
</script>

</body>
</html>
